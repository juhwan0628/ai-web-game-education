name: Import portfolio snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-portfolio.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download snapshot
        run: |
          curl -fL --retry 3 -o /tmp/portfolio.tar.gz https://juhwan.ing/ai-web-game-education-upload.tar.gz

      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/portfolio.tar.gz -C .
          rm -f .bootstrap

      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI web game education portfolio"
          git push
