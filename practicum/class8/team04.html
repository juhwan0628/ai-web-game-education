<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>똥 피하기 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0f7fa; /* 하늘색 배경 (밝고 신나는 분위기) */
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: #ffffff; /* 흰색 게임 화면 */
            border: 4px solid #b2ebf2;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
        }

        /* 흐릿한 느낌의 UI 스타일 */
        .blur-ui {
            color: rgba(0, 0, 0, 0.3); /* 글자 색상을 흐리게 */
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.2); /* 약간의 번짐 효과 */
            font-weight: bold;
        }

        #scoreBoard {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            text-align: right;
        }

        #timerBoard {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
        }

        /* 스크린 오버레이 (시작, 성공, 실패) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        /* 흐릿한 느낌의 버튼 */
        .blur-btn {
            padding: 10px 30px;
            font-size: 20px;
            background-color: rgba(178, 235, 242, 0.5);
            color: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            cursor: pointer;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            font-weight: bold;
        }

        .blur-btn:hover {
            background-color: rgba(178, 235, 242, 0.8);
            color: rgba(0, 0, 0, 0.6);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="timerBoard" class="blur-ui">남은 시간: 03:00</div>
        <div id="scoreBoard" class="blur-ui">Score: 0</div>

        <div id="startScreen" class="screen">
            <h1 class="blur-ui">💩 똥 피하기 게임 🪰</h1>
            <p class="blur-ui" style="font-size: 16px; margin-bottom: 20px;">
                오른쪽(▶): 전진 | 위쪽(▲): 점프 | 아래쪽(▼): 빠르게 착지<br>
                변기통(🚽)을 피하고 파리(🪰)를 먹어 점수를 올리세요! (3분 버티기)
            </p>
            <button id="startBtn" class="blur-btn">게임 시작</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1 class="blur-ui" style="color: rgba(239, 83, 80, 0.5);">게임 실패... 🚽</h1>
            <p id="finalScoreFail" class="blur-ui" style="font-size: 20px; margin-bottom: 20px;">최종 점수: 0점</p>
            <button id="restartBtnFail" class="blur-btn">다시 시도</button>
        </div>

        <div id="gameSuccessScreen" class="screen hidden">
            <h1 class="blur-ui" style="color: rgba(76, 175, 80, 0.5);">🎉 게임 성공! 🎉</h1>
            <p id="finalScoreSuccess" class="blur-ui" style="font-size: 20px; margin-bottom: 20px;">최종 점수: 0점</p>
            <button id="restartBtnSuccess" class="blur-btn">한 번 더 하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 요소
        const scoreBoard = document.getElementById('scoreBoard');
        const timerBoard = document.getElementById('timerBoard');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameSuccessScreen = document.getElementById('gameSuccessScreen');
        
        const startBtn = document.getElementById('startBtn');
        const restartBtnFail = document.getElementById('restartBtnFail');
        const restartBtnSuccess = document.getElementById('restartBtnSuccess');
        
        const finalScoreFail = document.getElementById('finalScoreFail');
        const finalScoreSuccess = document.getElementById('finalScoreSuccess');

        // 게임 변수
        let gameActive = false;
        let score = 0;
        let timeRemaining = 180; // 3분 = 180초
        let gameLoopId;
        let timerId;
        let scoreTimerId;

        // 플레이어 (똥 💩)
        const player = {
            x: 100,
            y: 330,
            size: 40,
            speedX: 4,
            gravity: 0.6,
            jumpForce: -13,
            velocityY: 0,
            isJumping: false
        };

        // 장애물(변기 🚽) 및 아이템(파리 🪰) 배열
        let obstacles = [];
        let items = [];
        
        // 생성 주기 조절용 카운터
        let obstacleSpawnTimer = 0;
        let itemSpawnTimer = 0;

        // 키 입력 상태
        const keys = {
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false
        };

        // 이벤트 리스너 등록
        window.addEventListener('keydown', (e) => {
            if (e.key in keys) {
                keys[e.key] = true;
                // 위쪽 방향키를 누르고 점프 중이 아닐 때 점프
                if (e.key === 'ArrowUp' && !player.isJumping && gameActive) {
                    player.velocityY = player.jumpForce;
                    player.isJumping = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        startBtn.addEventListener('click', startGame);
        restartBtnFail.addEventListener('click', startGame);
        restartBtnSuccess.addEventListener('click', startGame);

        // 게임 시작 함수
        function startGame() {
            // 초기화
            gameActive = true;
            score = 0;
            timeRemaining = 180;
            obstacles = [];
            items = [];
            player.x = 100;
            player.y = 330;
            player.velocityY = 0;
            player.isJumping = false;
            
            scoreBoard.textContent = `Score: ${score}`;
            updateTimerText();

            // 화면 전환
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameSuccessScreen.classList.add('hidden');

            // 타이머 작동 (1초마다 감소)
            clearInterval(timerId);
            timerId = setInterval(() => {
                if (gameActive) {
                    timeRemaining--;
                    updateTimerText();
                    if (timeRemaining <= 0) {
                        endGame(true); // 시간 다 되면 승리
                    }
                }
            }, 1000);

            // 10초당 1점 배부 타이머
            clearInterval(scoreTimerId);
            scoreTimerId = setInterval(() => {
                if (gameActive) {
                    score += 1;
                    scoreBoard.textContent = `Score: ${score}`;
                }
            }, 10000);

            // 루프 시작
            cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 타이머 텍스트 변환 (MM:SS)
        function updateTimerText() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerBoard.textContent = `남은 시간: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 게임 종료 처리
        function endGame(isSuccess) {
            gameActive = false;
            clearInterval(timerId);
            clearInterval(scoreTimerId);
            cancelAnimationFrame(gameLoopId);

            if (isSuccess) {
                finalScoreSuccess.textContent = `최종 점수: ${score}점`;
                gameSuccessScreen.classList.remove('hidden');
            } else {
                finalScoreFail.textContent = `최종 점수: ${score}점`;
                gameOverScreen.classList.remove('hidden');
            }
        }

        // 메인 게임 루프
        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 플레이어 업데이트 (오른쪽 이동 및 점프, 아래로 내려오기)
            if (keys.ArrowRight) {
                player.x += player.speedX;
                // 화면 오른쪽 경계 제한
                if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
            }
            if (keys.ArrowDown) {
                // 아래쪽 방향키 누르면 빠르게 하강
                player.velocityY += 1.5;
            }

            // 중력 적용
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 바닥 충돌 처리 (바닥 좌표 y = 330)
            if (player.y >= 330) {
                player.y = 330;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // 플레이어 그리기 (이모지 💩)
            ctx.font = `${player.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💩', player.x + player.size/2, player.y + player.size/2);


            // 2. 장애물(변기통 🚽) 생성 및 관리
            obstacleSpawnTimer++;
            // 난이도 조절: 시간이 지날수록 변기가 더 자주 나옴
            let spawnInterval = Math.max(40, 90 - (180 - timeRemaining) * 0.3); 
            if (obstacleSpawnTimer > spawnInterval) {
                obstacles.push({
                    x: canvas.width,
                    y: 330, // 바닥에 생성
                    size: 40,
                    speed: 5 + (180 - timeRemaining) * 0.02 // 시간이 갈수록 조금씩 빨라짐
                });
                obstacleSpawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed;

                // 그리기 (이모지 🚽)
                ctx.font = `${obs.size}px Arial`;
                ctx.fillText('🚽', obs.x + obs.size/2, obs.y + obs.size/2);

                // 충돌 검사 (실패 조건)
                if (
                    player.x < obs.x + obs.size - 5 &&
                    player.x + player.size > obs.x + 5 &&
                    player.y < obs.y + obs.size - 5 &&
                    player.y + player.size > obs.y + 5
                ) {
                    endGame(false); // 변기에 부딪히면 실패
                    return;
                }

                // 화면 밖으로 나간 장애물 제거
                if (obs.x < -obs.size) {
                    obstacles.splice(i, 1);
                }
            }


            // 3. 목표물(파리 🪰) 생성 및 관리
            itemSpawnTimer++;
            if (itemSpawnTimer > 120) { // 약 2초마다 파리 생성
                items.push({
                    x: canvas.width,
                    // 파리는 공중에 무작위 높이로 생성
                    y: 150 + Math.random() * 150, 
                    size: 25,
                    speed: 3
                });
                itemSpawnTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.x -= item.speed;

                // 그리기 (이모지 🪰)
                ctx.font = `${item.size}px Arial`;
                ctx.fillText('🪰', item.x + item.size/2, item.y + item.size/2);

                // 충돌 검사 (점수 획득 조건)
                if (
                    player.x < item.x + item.size &&
                    player.x + player.size > item.x &&
                    player.y < item.y + item.size &&
                    player.y + player.size > item.y
                ) {
                    score += 1; // 파리 먹으면 1점 배부
                    scoreBoard.textContent = `Score: ${score}`;
                    items.splice(i, 1); // 먹은 파리 제거
                    continue;
                }

                // 화면 밖으로 나간 파리 제거
                if (item.x < -item.size) {
                    items.splice(i, 1);
                }
            }

            // 지속 루프
            gameLoopId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
