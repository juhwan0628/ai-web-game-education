<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트로베리 서바이벌</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: #2c3e50;
            font-family: 'Jua', sans-serif; overflow: hidden; user-select: none;
        }
        canvas { display: block; }

        /* UI 고정 레이어 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
        }

        #score-board, #wave-board, #gun-ammo-board {
            position: absolute; font-size: 24px; background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #wave-board { top: 20px; left: 20px; color: #388e3c; border: 3px solid #66bb6a; }
        #score-board { top: 20px; right: 20px; color: #d32f2f; border: 3px solid #ff5252; }
        #gun-ammo-board { 
            bottom: 80px; right: 20px; color: #555; border: 3px solid #aaa; 
            display: none; 
        }

        #hp-bar-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 400px; height: 20px; background-color: #ddd;
            border-radius: 10px; border: 3px solid #fff;
        }

        #hp-bar {
            width: 100%; height: 100%; background-color: #ff5252;
            border-radius: 7px; transition: width 0.2s;
        }

        #exp-bar-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 400px; height: 15px; background-color: #ddd;
            border-radius: 10px; border: 3px solid #fff;
        }

        #exp-bar {
            width: 0%; height: 100%; background-color: #42a5f5;
            border-radius: 5px; transition: width 0.2s;
        }

        .text-center {
            text-align: center; width: 100%; position: absolute;
            bottom: 70px; font-size: 20px; color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 반투명 오버레이 (게임오버 / 클리어 / 레벨업) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto; z-index: 10;
        }

        .hidden { display: none !important; }
        .overlay h1 { font-size: 80px; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .overlay p { color: white; font-size: 24px; margin-top: 10px; }
        
        #game-over-overlay h1 { color: #ff5252; }
        #level-up-overlay h1 { color: #ffd54f; font-size: 50px;}

        .cute-btn {
            margin-top: 30px; padding: 15px 40px; font-size: 24px;
            font-family: 'Jua', sans-serif; background-color: #ff6b81;
            color: white; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 5px 0 #d9534f; transition: all 0.1s;
        }
        .cute-btn:active { transform: translateY(5px); box-shadow: none; }

        /* 레벨업 무기 카드 */
        .weapon-cards { display: flex; gap: 20px; margin-top: 30px; }
        .card {
            background: white; border-radius: 15px; padding: 20px;
            width: 200px; text-align: center; cursor: pointer;
            border: 4px solid #fff; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-10px); border-color: #ff6b81; }
        .card h2 { margin: 10px 0; color: #333; }
        .card p { color: #666; font-size: 16px; margin: 5px 0; }
        .card .emoji { font-size: 50px; margin: 0; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="wave-board">웨이브: <span id="waveText">1</span> (다음: <span id="nextWaveText">20</span>마리)</div>
    <div id="score-board">점수: <span id="scoreText">0</span></div>
    <div id="gun-ammo-board">🔫 탄창: <span id="ammoText">20</span>/20</div>
    <div class="text-center">Lv.<span id="levelText">1</span> 귀여운 토끼 🐰</div>
    <div id="hp-bar-container"><div id="hp-bar"></div></div>
    <div id="exp-bar-container"><div id="exp-bar"></div></div>
</div>

<div id="game-over-overlay" class="overlay">
    <h1 id="overlay-title">스트로베리 서바이벌</h1>
    <p id="overlay-desc">방향키로 움직여서 딸기들을 물리치세요!</p>
    <button id="restart-btn" class="cute-btn">게임 시작</button>
</div>

<div id="level-up-overlay" class="overlay hidden">
    <h1>레벨 업!</h1>
    <p>무기를 선택하거나 업그레이드 하세요 (최대 5레벨)</p>
    <div class="weapon-cards">
        <div class="card" onclick="selectWeapon('axe')">
            <div class="emoji">🪓</div>
            <h2>도끼</h2>
            <p id="desc-axe">관통하는 도끼를 던집니다.</p>
        </div>
        <div class="card" onclick="selectWeapon('sword')">
            <div class="emoji">🗡️</div>
            <h2>단검</h2>
            <p id="desc-sword">강력한 단일 공격입니다.</p>
        </div>
        <div class="card" onclick="selectWeapon('gun')">
            <div class="emoji">🔫</div>
            <h2>총</h2>
            <p id="desc-gun">빠르게 연사하지만 장전이 필요합니다.</p>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const WORLD_WIDTH = 3000; const WORLD_HEIGHT = 3000;
    let cameraX = 0; let cameraY = 0; let grassTufts = [];

    // UI 요소
    const scoreText = document.getElementById('scoreText');
    const waveText = document.getElementById('waveText');
    const nextWaveText = document.getElementById('nextWaveText');
    const levelText = document.getElementById('levelText');
    const hpBar = document.getElementById('hp-bar');
    const expBar = document.getElementById('exp-bar');
    const ammoBoard = document.getElementById('gun-ammo-board');
    const ammoText = document.getElementById('ammoText');
    
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const levelUpOverlay = document.getElementById('level-up-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');

    let isPlaying = false; let isPaused = false;
    let score = 0; let wave = 1; let waveKills = 0; let killsNeededForNextWave = 20;
    let enemyIdCounter = 0;

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

    const player = {
        x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, size: 30, speed: 5,
        hp: 100, maxHp: 100, exp: 0, maxExp: 20, level: 1,
        invincible: 0 // ✨ 무적 시간 프레임 변수 추가
    };

    let weapons = {
        basic: { level: 1, damage: 3, cooldown: 60, timer: 0 },
        axe:   { level: 0, damage: 6, cooldown: 120, timer: 0 },
        sword: { level: 0, damage: 9, cooldown: 75, timer: 0 },
        gun:   { level: 0, damage: 6, cooldown: 48, timer: 0, ammo: 20, maxAmmo: 20, isReloading: false, reloadTimer: 0 }
    };

    let enemies = []; let projectiles = []; let enemySpawnTimer = 0;

    function initGame() {
        player.x = WORLD_WIDTH / 2; player.y = WORLD_HEIGHT / 2;
        player.hp = player.maxHp = 100;
        player.exp = 0; player.maxExp = 20; player.level = 1;
        player.invincible = 0; // 초기화
        
        score = 0; wave = 1; waveKills = 0; killsNeededForNextWave = 20;
        enemies = []; projectiles = []; 
        
        weapons.basic = { level: 1, damage: 3, cooldown: 60, timer: 0 };
        weapons.axe = { level: 0, damage: 6, cooldown: 120, timer: 0 };
        weapons.sword = { level: 0, damage: 9, cooldown: 75, timer: 0 };
        weapons.gun = { level: 0, damage: 6, cooldown: 48, timer: 0, ammo: 20, maxAmmo: 20, isReloading: false, reloadTimer: 0 };
        
        grassTufts = [];
        for(let i=0; i<300; i++) {
            grassTufts.push({ x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT });
        }

        updateUI(); isPlaying = true; isPaused = false;
        gameOverOverlay.classList.add('hidden'); levelUpOverlay.classList.add('hidden');
        ammoBoard.style.display = 'none';
        
        requestAnimationFrame(gameLoop);
    }

    function spawnEnemy() {
        if(wave >= 40 && enemies.filter(e => e.type === 'boss').length > 0) return;

        let angle = Math.random() * Math.PI * 2;
        let dist = Math.max(canvas.width, canvas.height) / 2 + 100; 
        let ex = player.x + Math.cos(angle) * dist;
        let ey = player.y + Math.sin(angle) * dist;

        if (wave >= 40 && enemies.filter(e => e.type === 'boss').length === 0) {
            enemies.push({ id: enemyIdCounter++, x: ex, y: ey, size: 100, speed: 2, hp: 2000, maxHp: 2000, type: 'boss' });
        } else {
            let speed = 1.5 + (Math.random() * 1.5) + (wave * 0.05);
            enemies.push({ id: enemyIdCounter++, x: ex, y: ey, size: 25, speed: speed, hp: 10, maxHp: 10, type: 'normal' });
        }
    }

    function getNearestEnemy() {
        if (enemies.length === 0) return null;
        let nearest = null; let minDist = Infinity;
        enemies.forEach(enemy => {
            let dist = getDistance(player.x, player.y, enemy.x, enemy.y);
            if (dist < minDist) { minDist = dist; nearest = enemy; }
        });
        return nearest;
    }

    function shootProjectile(type, target) {
        let dx = target.x - player.x; let dy = target.y - player.y;
        let dist = Math.sqrt(dx*dx + dy*dy); let w = weapons[type];
        let p = { x: player.x, y: player.y, vx: (dx / dist), vy: (dy / dist), type: type, damage: w.damage };

        if (type === 'basic') { p.speed = 8; p.emoji = '✨'; p.size = 15; p.pierce = false; }
        else if (type === 'axe') { p.speed = 6; p.emoji = '🪓'; p.size = 30; p.pierce = true; p.hitList = new Set(); }
        else if (type === 'sword') { p.speed = 12; p.emoji = '🗡️'; p.size = 25; p.pierce = false; }
        else if (type === 'gun') { p.speed = 15; p.emoji = '🔥'; p.size = 10; p.pierce = false; }

        p.vx *= p.speed; p.vy *= p.speed; projectiles.push(p);
    }

    function handleWeapons() {
        let target = getNearestEnemy();
        if (!target) return;

        if (weapons.basic.level > 0) {
            weapons.basic.timer++;
            if (weapons.basic.timer >= weapons.basic.cooldown) {
                shootProjectile('basic', target); weapons.basic.timer = 0;
            }
        }
        if (weapons.axe.level > 0) {
            weapons.axe.timer++;
            if (weapons.axe.timer >= weapons.axe.cooldown) {
                shootProjectile('axe', target); weapons.axe.timer = 0;
            }
        }
        if (weapons.sword.level > 0) {
            weapons.sword.timer++;
            if (weapons.sword.timer >= weapons.sword.cooldown) {
                shootProjectile('sword', target); weapons.sword.timer = 0;
            }
        }
        if (weapons.gun.level > 0) {
            if (weapons.gun.isReloading) {
                weapons.gun.reloadTimer--;
                if (weapons.gun.reloadTimer <= 0) {
                    weapons.gun.isReloading = false;
                    weapons.gun.ammo = weapons.gun.maxAmmo;
                    updateUI();
                }
            } else {
                weapons.gun.timer++;
                if (weapons.gun.timer >= weapons.gun.cooldown) {
                    shootProjectile('gun', target);
                    weapons.gun.ammo--; weapons.gun.timer = 0;
                    updateUI();
                    
                    if (weapons.gun.ammo <= 0) {
                        weapons.gun.isReloading = true;
                        // ✨ 2.5초 장전 (1초 = 60프레임이므로 2.5 * 60 = 150프레임)
                        weapons.gun.reloadTimer = 150; 
                    }
                }
            }
        }
    }

    function checkLevelUp() {
        if (player.exp >= player.maxExp) {
            player.level++; player.exp -= player.maxExp;
            player.maxExp = Math.floor(player.maxExp * 1.5);
            player.maxHp += 20; player.hp = player.maxHp;
            
            isPaused = true; updateLevelUpCards(); levelUpOverlay.classList.remove('hidden');
        }
        updateUI();
    }

    function updateLevelUpCards() {
        const types = ['axe', 'sword', 'gun'];
        types.forEach(type => {
            let w = weapons[type]; let desc = document.getElementById(`desc-${type}`);
            if (w.level === 0) { desc.innerText = "새로운 무기 획득!"; } 
            else if (w.level >= 5) { desc.innerText = "MAX LEVEL\n(선택시 체력 20 회복)"; } 
            else {
                let nextDmg = (w.damage * 1.45).toFixed(1);
                desc.innerText = `현재 Lv.${w.level}\n데미지: ${nextDmg}로 증가\n공속 빨라짐!`;
            }
        });
    }

    window.selectWeapon = function(type) {
        let w = weapons[type];
        if (w.level >= 5) { player.hp = Math.min(player.maxHp, player.hp + 20); } 
        else {
            if (w.level === 0) {
                w.level = 1; if (type === 'gun') ammoBoard.style.display = 'block';
            } else {
                w.level++; w.damage = w.damage * 1.45; w.cooldown = w.cooldown / 1.1;
            }
        }
        isPaused = false; levelUpOverlay.classList.add('hidden'); updateUI();
    };

    function getDistance(x1, y1, x2, y2) { return Math.sqrt(Math.pow(x1 - x2, 2) + Math.pow(y1 - y2, 2)); }

    function updateUI() {
        scoreText.innerText = score; waveText.innerText = wave;
        nextWaveText.innerText = killsNeededForNextWave - waveKills;
        levelText.innerText = player.level;
        hpBar.style.width = (player.hp / player.maxHp * 100) + '%';
        expBar.style.width = (player.exp / player.maxExp * 100) + '%';
        
        if (weapons.gun.isReloading) {
            ammoText.innerText = "장전중!"; ammoText.style.color = "red";
        } else {
            ammoText.innerText = weapons.gun.ammo; ammoText.style.color = "#555";
        }
    }

    function gameOver(isClear) {
        isPlaying = false; gameOverOverlay.classList.remove('hidden');
        overlayTitle.innerText = isClear ? 'GAME CLEAR' : 'GAME OVER';
        overlayTitle.style.color = isClear ? '#ffd54f' : '#ff5252';
        overlayDesc.innerText = isClear ? '딸기의 마왕을 물리쳤습니다!' : `도달한 웨이브: ${wave}, 점수: ${score}`;
    }

    function gameLoop() {
        if (!isPlaying) return;
        requestAnimationFrame(gameLoop);
        if (isPaused) return; 

        // ✨ 무적 시간 감소 로직 (0보다 크면 매 프레임 1씩 깎임)
        if (player.invincible > 0) {
            player.invincible--;
        }

        cameraX = player.x - canvas.width / 2; cameraY = player.y - canvas.height / 2;
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, cameraY));

        ctx.fillStyle = '#e8f5e9'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(-cameraX, -cameraY); 

        ctx.fillStyle = '#c8e6c9'; ctx.font = '20px Arial';
        grassTufts.forEach(g => ctx.fillText('🌿', g.x, g.y));

        ctx.strokeStyle = '#81c784'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        let dx = 0, dy = 0;
        if (keys.ArrowUp) dy -= 1; if (keys.ArrowDown) dy += 1;
        if (keys.ArrowLeft) dx -= 1; if (keys.ArrowRight) dx += 1;
        
        if (dx !== 0 && dy !== 0) { let length = Math.sqrt(dx*dx + dy*dy); dx /= length; dy /= length; }
        
        player.x += dx * player.speed; player.y += dy * player.speed;
        player.x = Math.max(player.size, Math.min(WORLD_WIDTH - player.size, player.x));
        player.y = Math.max(player.size, Math.min(WORLD_HEIGHT - player.size, player.y));

        handleWeapons();

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i]; p.x += p.vx; p.y += p.vy;
            
            ctx.save(); ctx.translate(p.x, p.y);
            if (p.type === 'axe' || p.type === 'sword') { ctx.rotate(Date.now() / 100); }
            ctx.font = `${p.size}px Arial`; ctx.fillText(p.emoji, 0, 0); ctx.restore();
            
            if (p.x < cameraX - 100 || p.x > cameraX + canvas.width + 100 || 
                p.y < cameraY - 100 || p.y > cameraY + canvas.height + 100) { projectiles.splice(i, 1); }
        }

        enemySpawnTimer++;
        let spawnRate = Math.max(5, 60 - (wave * 3)); 
        if (enemySpawnTimer >= spawnRate) { spawnEnemy(); enemySpawnTimer = 0; }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            let edx = player.x - enemy.x; let edy = player.y - enemy.y;
            let dist = Math.sqrt(edx*edx + edy*edy);
            enemy.x += (edx / dist) * enemy.speed; enemy.y += (edy / dist) * enemy.speed;

            ctx.font = enemy.type === 'boss' ? '120px Arial' : '30px Arial';
            ctx.fillText(enemy.type === 'boss' ? '👹🍓' : '🍓', enemy.x, enemy.y);
            
            if (enemy.type === 'boss') {
                ctx.fillStyle = 'black'; ctx.fillRect(enemy.x - 50, enemy.y - 80, 100, 10);
                ctx.fillStyle = 'red'; ctx.fillRect(enemy.x - 50, enemy.y - 80, 100 * (enemy.hp / enemy.maxHp), 10);
            }

            // ✨ 무적 상태 확인 후 플레이어 피격 처리
            if (dist < player.size + (enemy.size / 2)) {
                // 무적 시간이 0일 때만 데미지를 입힘
                if (player.invincible <= 0) {
                    player.hp -= enemy.type === 'boss' ? 5 : 1;
                    
                    // 데미지를 입으면 0.25초(15프레임) 동안 무적 상태 부여!
                    player.invincible = 15; 
                    
                    updateUI();
                    if (player.hp <= 0) { gameOver(false); return; }
                }
            }

            for (let j = projectiles.length - 1; j >= 0; j--) {
                let p = projectiles[j];
                if (getDistance(enemy.x, enemy.y, p.x, p.y) < enemy.size) {
                    if (p.pierce) {
                        if (p.hitList.has(enemy.id)) continue;
                        p.hitList.add(enemy.id);
                    }
                    enemy.hp -= p.damage;
                    if (!p.pierce) projectiles.splice(j, 1); 
                    
                    if (enemy.hp <= 0) {
                        if (enemy.type === 'boss') { gameOver(true); return; } 
                        else {
                            score += 10; player.exp += 2; waveKills++;
                            if (waveKills >= killsNeededForNextWave && wave < 40) {
                                wave++; waveKills = 0; killsNeededForNextWave = Math.floor(killsNeededForNextWave * 1.75);
                            }
                            checkLevelUp(); enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }
        }

        // ✨ 플레이어 그리기 (무적 상태일 때 깜빡임 효과)
        ctx.font = '40px Arial';
        if (player.invincible > 0) {
            // 시간이 지나면서 투명도를 0.5와 1.0으로 번갈아가며 설정해 깜빡이게 만듦
            ctx.globalAlpha = (Math.floor(Date.now() / 50) % 2 === 0) ? 0.3 : 1.0; 
        }
        ctx.fillText('🐰', player.x, player.y);
        ctx.globalAlpha = 1.0; // 투명도 원상복구 (필수!)

        ctx.restore(); 
    }

    document.getElementById('restart-btn').addEventListener('click', initGame);

</script>
</body>
</html>
