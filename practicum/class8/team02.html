<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>꽃집차리기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff6f8;
      color: #2a1b2f;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(760px, 94vw);
      text-align: center;
      background: #ffffff;
      border: 4px solid #e35d8b;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 14px 35px #d96b9440;
    }
    h1 { margin: 0 0 8px; font-size: 34px; }
    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0;
      font-weight: 900;
    }
    .score div {
      border: 2px solid #e35d8b;
      border-radius: 8px;
      padding: 10px;
      background: #fff0f5;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 18px auto;
      max-width: 520px;
    }
    .card {
      height: 220px;
      display: grid;
      place-items: center;
      border: 4px solid #2a1b2f;
      border-radius: 8px;
      background: linear-gradient(#fff, #ffe7f0);
      font-size: 86px;
      box-shadow: inset 0 0 0 8px #ffffff;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 20px;
      background: #2a9d8f;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
    }
    #message { min-height: 30px; font-weight: 900; font-size: 20px; }
    .help { margin-top: 12px; color: #6c4f61; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>꽃집차리기</h1>
    <div class="score">
      <div>점수 <span id="score">0</span></div>
      <div>라운드 <span id="round">0</span></div>
      <div>연속 성공 <span id="combo">0</span></div>
    </div>
    <div class="cards">
      <div class="card" id="cardA">?</div>
      <div class="card" id="cardB">?</div>
    </div>
    <p id="message">랜덤 카드 2장을 뽑아 같은 꽃이면 10점!</p>
    <button id="draw">카드 뽑기</button>
    <p class="help">마우스 클릭 또는 Space 키로 진행합니다. 같은 카드면 기본 10점, 연속 성공 보너스가 붙습니다.</p>
  </main>

  <script>
    const flowers = ['🌷', '🌻', '🌹', '🌼', '🌸', '🪻'];
    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');
    const scoreText = document.getElementById('score');
    const roundText = document.getElementById('round');
    const comboText = document.getElementById('combo');
    const message = document.getElementById('message');
    let score = 0;
    let round = 0;
    let combo = 0;
    let locked = false;

    function pick() {
      return flowers[Math.floor(Math.random() * flowers.length)];
    }

    function drawCards() {
      if (locked) return;
      locked = true;
      cardA.textContent = '?';
      cardB.textContent = '?';
      message.textContent = '카드를 섞는 중...';
      setTimeout(() => {
        const a = pick();
        const b = pick();
        cardA.textContent = a;
        cardB.textContent = b;
        round += 1;
        if (a === b) {
          combo += 1;
          const gain = 10 + Math.max(0, combo - 1) * 2;
          score += gain;
          message.textContent = `같은 꽃! +${gain}점`;
        } else {
          combo = 0;
          message.textContent = '다른 꽃입니다. 다시 뽑기!';
        }
        scoreText.textContent = score;
        roundText.textContent = round;
        comboText.textContent = combo;
        locked = false;
      }, 280);
    }

    document.getElementById('draw').addEventListener('click', drawCards);
    addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        drawCards();
      }
    });
  </script>
</body>
</html>
