<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디그디그 아이오 (DigDig.io)</title>
    <style>
        /* 깊고 어두운 땅굴 내부 분위기 */
        body {
            margin: 0;
            background-color: #2b1810; 
            color: #e0d4c3;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 650px;
            background-color: #5c3a21; /* 주요 색상: 갈색 땅굴 */
            border: 12px solid #3d2314; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            cursor: none; /* 마우스 커서 대신 플레이어 돌 표현 */
        }

        /* 점수가 보이는 방식: 직관적인 숫자 */
        .ui-text {
            position: absolute;
            font-weight: bold;
            text-shadow: 2px 2px 4px #1a0f0a;
        }

        #score-board {
            top: 20px;
            left: 20px;
            font-size: 26px;
            color: #fffde7;
        }

        /* 화면 중앙 안내창 (시작/실패) */
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 24, 16, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* 버튼과 글자 느낌: 신나고 유쾌한 분위기 */
        h1 {
            font-size: 55px;
            color: #ffb300;
            margin-bottom: 5px;
            text-shadow: 4px 4px 0px #3d2314;
        }

        .mood-text {
            font-size: 24px;
            color: #ffd54f;
            font-weight: bold;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            margin-bottom: 35px;
            color: #bcaaa4;
            text-align: center;
            line-height: 1.7;
        }

        .btn-dig {
            padding: 18px 50px;
            font-size: 26px;
            font-weight: bold;
            background-color: #8d6e63;
            color: #ffffff;
            border: 4px solid #4e342e;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0px #2b1810;
            transition: 0.1s;
        }

        .btn-dig:hover {
            background-color: #7ca17c; 
        }

        .btn-dig:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #2b1810;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board" class="ui-text">현재 내 돌의 크기: <span id="score">20</span></div>
        
        <div id="screen-overlay">
            <h1 id="title-text">디그디그 아이오</h1>
            <div class="mood-text">야 기분 좋다! 땅굴 파러 가자!</div>
            <p id="info-text">
                마우스로 <strong>나의 돌(🪨)</strong>을 움직여 광물을 먹고 커지세요!<br>
                ✨ 골드(💛+5) | 에메랄드(💚+10) | 다이아몬드(💙+25)<br>
                🌋 <strong>용암(🌋)</strong>에 닿으면 몸집(점수)이 빠르게 녹아내리니 주의하세요!<br>
                💥 나보다 <strong>큰 적(👹)</strong>에게 부딪히면 완전히 따먹혀 게임오버됩니다!
            </p>
            <button id="start-btn" class="btn-dig">굴착 시작!</button>
        </div>

        <canvas id="gameCanvas" width="900" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score');
        const screenOverlay = document.getElementById('screen-overlay');
        const titleText = document.getElementById('title-text');
        const infoText = document.getElementById('info-text');
        const startBtn = document.getElementById('start-btn');

        let gameActive = false;
        let score = 20; // 초기 점수이자 크기 기준
        let spawnTimer = 0;

        // 플레이어 (돌 🪨)
        const player = { x: 450, y: 325, size: 20, emoji: '🪨' };

        // 광물 및 용암, 적 배열
        let items = [];
        let enemies = [];

        // 마우스 이동 감지
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        startBtn.addEventListener('click', () => {
            screenOverlay.style.display = 'none';
            resetGame();
            gameActive = true;
            animate();
        });

        function resetGame() {
            score = 20;
            player.size = 20;
            items = [];
            enemies = [];
            scoreBoard.innerText = Math.floor(score);
            
            // 초기 맵 구성
            for(let i=0; i<15; i++) spawnItem();
        }

        // 아이템(광물/용암) 스폰 시스템
        function spawnItem() {
            const rand = Math.random();
            let type, emoji, points, sizeBonus;

            if (rand < 0.4) {
                type = 'gold'; emoji = '💛'; points = 5; sizeBonus = 1;
            } else if (rand < 0.7) {
                type = 'emerald'; emoji = '💚'; points = 10; sizeBonus = 2;
            } else if (rand < 0.85) {
                type = 'diamond'; emoji = '💙'; points = 25; sizeBonus = 5;
            } else {
                type = 'lava'; emoji = '🌋'; points = 0; sizeBonus = 0; // 용암 (지속 대미지형 부딪힘)
            }

            items.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: Math.random() * (canvas.height - 60) + 30,
                size: type === 'lava' ? 22 : 16,
                type: type,
                emoji: emoji,
                points: points,
                sizeBonus: sizeBonus
            });
        }

        // 상대 돌(적 👹) 스폰
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = -30; y = Math.random() * canvas.height; }
            else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = -30; }
            else { x = Math.random() * canvas.width; y = canvas.height + 30; }

            // 현재 내 몸집 기준으로 조금 작거나 조금 큰 적 생성
            const enemySize = player.size * (0.6 + Math.random() * 0.9);
            const angle = Math.atan2(player.y - y, player.x - x);
            const speed = 1.2 + Math.random() * 1.5;

            enemies.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: enemySize,
                emoji: '👹'
            });
        }

        function checkCollision(obj1, obj2) {
            const dist = Math.hypot(obj1.x - obj2.x, obj1.y - obj2.y);
            return dist < (obj1.size + obj2.size * 0.7); // 이모지 여백 보정
        }

        function gameOver() {
            gameActive = false;
            titleText.innerText = "💥 완전히 따먹혔습니다!";
            infoText.innerHTML = `<div style="font-size:24px; color:#ff8a65; margin-bottom:10px;">야, 기분 아쉽다! 다음 판을 노리자!</div>최종 성장 숫자: <strong>${Math.floor(score)}</strong>`;
            startBtn.innerText = "다시 땅굴 파기";
            screenOverlay.style.display = 'flex';
        }

        // 메인 루프
        function animate() {
            if (!gameActive) return;

            // 1. 갈색 땅굴 배경 드로잉
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 거친 땅굴 느낌을 주기 위한 패턴 선
            ctx.strokeStyle = '#4e342e';
            ctx.lineWidth = 3;
            for(let i = 0; i < canvas.width; i += 70) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 15, canvas.height); ctx.stroke();
            }

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 2. 광물 및 용암 연산
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                ctx.font = `${item.size * 1.5}px Arial`;
                ctx.fillText(item.emoji, item.x, item.y);

                if (checkCollision(player, item)) {
                    if (item.type === 'lava') {
                        // 용암: 즉사가 아니라 크기(점수)가 실시간으로 깎임!
                        score -= 0.4; 
                        player.size -= 0.08;
                        
                        // 최소 크기(숫자 10) 이하로 떨어지면 부서짐(게임오버)
                        if (score < 10) {
                            gameOver();
                            return;
                        }
                        scoreBoard.innerText = Math.floor(score);
                        
                        // 닿아도 용암은 사라지지 않고 플레이어가 비켜나야 함 (가끔 무작위 재생성)
                        if(Math.random() < 0.01) {
                            items.splice(i, 1);
                            spawnItem();
                        }
                    } else {
                        // 일반 광물 획득
                        score += item.points;
                        player.size += item.sizeBonus;
                        scoreBoard.innerText = Math.floor(score);
                        items.splice(i, 1);
                        spawnItem();
                    }
                }
            }

            if(items.length < 15) spawnItem();

            // 3. 상대방 돌(👹) 연산
            spawnTimer++;
            if (spawnTimer % 100 === 0 && enemies.length < 5) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                ctx.font = `${e.size * 2}px Arial`;
                ctx.fillText(e.emoji, e.x, e.y);

                // 화면 탈출 시 삭제
                if (e.x < -100 || e.x > canvas.width + 100 || e.y < -100 || e.y > canvas.height + 100) {
                    enemies.splice(i, 1);
                    continue;
                }

                // 적과의 충돌 판단
                if (checkCollision(player, e)) {
                    if (player.size > e.size) {
                        // 내가 더 크면 적을 따먹고 흡수함!
                        score += Math.floor(e.size);
                        player.size += e.size * 0.2;
                        scoreBoard.innerText = Math.floor(score);
                        enemies.splice(i, 1);
                    } else {
                        // 내가 더 작으면 실패
                        gameOver();
                        return;
                    }
                }
            }

            // 4. 플레이어 돌(🪨) 그리기
            ctx.font = `${player.size * 2}px Arial`;
            ctx.fillText(player.emoji, player.x, player.y);

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
