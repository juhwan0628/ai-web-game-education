<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웹게임 수업 허브</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F7F8F5;
      --surface: #FFFFFF;
      --surface-soft: #FAFBF8;
      --text-primary: #202124;
      --text-secondary: #5F6368;
      --border: #DADCE0;
      --primary: #1E7A5F;
      --primary-dark: #145B46;
      --primary-soft: #E6F3EE;
      --accent-blue: #2F6FDB;
      --accent-blue-soft: #E8F0FE;
      --warning: #F4B400;
      --warning-soft: #FFF8DF;
      --error: #D93025;
      --error-soft: #FCE8E6;
      --code-bg: #F1F3F4;
      --shadow: 0 12px 28px rgba(32, 33, 36, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .sidebar,
    .screen-panel,
    .card,
    .template-box,
    .flow-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .sidebar {
      position: sticky;
      top: 18px;
      align-self: start;
      min-height: calc(100vh - 36px);
      max-height: calc(100vh - 36px);
      overflow: auto;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 18px;
      padding: 16px;
    }

    .brand {
      display: grid;
      gap: 4px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand strong {
      font-size: 20px;
      line-height: 1.2;
    }

    .brand span {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 800;
    }

    .screen-nav {
      display: grid;
      gap: 6px;
    }

    .nav-link {
      display: grid;
      gap: 2px;
      min-height: 54px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .nav-link span {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 900;
    }

    .nav-link strong {
      font-size: 15px;
      line-height: 1.25;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      border-color: var(--border);
      outline: none;
    }

    .nav-link.is-active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .tool-panel {
      display: grid;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .tool-label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 900;
    }

    .tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--primary);
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
    }

    .tool-link span {
      font-size: 18px;
      line-height: 1;
    }

    .tool-link:hover,
    .tool-link:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    .main-area {
      display: grid;
      min-width: 0;
      align-content: start;
      gap: 14px;
    }

    .screen-panel {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 36px);
      padding: clamp(22px, 3vw, 34px);
      box-shadow: var(--shadow);
    }

    .screen-kicker,
    .label,
    .meta {
      display: inline-flex;
      width: fit-content;
      min-height: 29px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
    }

    .screen-kicker,
    .label {
      border: 1px solid var(--border);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .meta {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .meta.pending {
      background: var(--warning-soft);
      color: #7A5600;
    }

    h1,
    h2,
    h3,
    p,
    ul,
    ol {
      margin-top: 0;
    }

    h1 {
      max-width: 900px;
      margin: 12px 0 12px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 10px;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p,
    li {
      color: var(--text-secondary);
    }

    .lead {
      max-width: 760px;
      margin-bottom: 22px;
      color: var(--text-primary);
      font-size: 21px;
      font-weight: 760;
    }

    .lead.wide {
      max-width: 1180px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .action-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 24px;
    }

    .two-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .three-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .class-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      display: grid;
      gap: 8px;
      align-content: start;
      min-height: 116px;
      padding: 16px;
      color: inherit;
      text-decoration: none;
    }

    .card strong {
      color: var(--text-primary);
    }

    .card p {
      margin-bottom: 0;
      font-size: 15px;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: var(--primary);
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    .button,
    .plain-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .button.secondary,
    .plain-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
    }

    .button.info {
      border-color: var(--accent-blue);
      background: var(--accent-blue);
      color: #fff;
    }

    .button:hover,
    .button:focus-visible,
    .plain-button:hover,
    .plain-button:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    .info-box,
    .warning-box,
    .error-box {
      margin-top: 14px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .warning-box {
      background: var(--warning-soft);
    }

    .error-box {
      border-color: #F3B8B2;
      background: var(--error-soft);
    }

    .info-box strong,
    .warning-box strong,
    .error-box strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .activity-timer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 clamp(24px, 2.4vw, 32px);
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .activity-timer.is-running {
      align-items: center;
      padding: clamp(20px, 3vw, 34px);
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .timer-status {
      display: grid;
      gap: 2px;
    }

    .timer-status strong {
      color: var(--text-primary);
      font-size: 15px;
    }

    .timer-status span {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 800;
    }

    .timer-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
    }

    .activity-timer.is-running .timer-display {
      font-size: clamp(72px, 12vw, 156px);
      letter-spacing: 0;
    }

    .activity-timer.is-running .timer-status strong {
      font-size: clamp(18px, 2vw, 28px);
    }

    .activity-timer.is-running .timer-status span {
      font-size: clamp(15px, 1.6vw, 21px);
    }

    .timer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .flow-card {
      display: grid;
      align-content: start;
      gap: clamp(15px, 2vw, 24px);
      min-height: calc(100vh - 104px);
      padding: clamp(22px, 3.6vw, 50px);
    }

    .flow-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .flow-card .step-label {
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
    }

    .slide-controls {
      display: flex;
      gap: 8px;
    }

    .slide-button {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .slide-button:hover,
    .slide-button:focus-visible {
      border-color: var(--primary);
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    .slide-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .flow-card h3 {
      max-width: 1120px;
      margin-bottom: 0;
      font-size: clamp(34px, 4.4vw, 64px);
      line-height: 1.14;
      overflow-wrap: break-word;
      text-wrap: balance;
      word-break: keep-all;
    }

    .scene-box,
    .question-box,
    .note-box {
      max-width: 1120px;
    }

    .scene-box {
      color: var(--text-primary);
      font-size: clamp(18px, 1.55vw, 24px);
      font-weight: 650;
      overflow-wrap: break-word;
      text-wrap: pretty;
      word-break: keep-all;
    }

    .scene-box p {
      margin-bottom: 10px;
    }

    .scene-box p:last-child,
    .scene-box ul:last-child {
      margin-bottom: 0;
    }

    .scene-box ul {
      display: grid;
      gap: 8px;
      margin: 0 0 10px;
      padding-left: 1.2em;
    }

    .scene-box li {
      padding-left: 2px;
    }

    .flow-visual {
      max-width: 1120px;
    }

    .flow-visual[hidden] {
      display: none;
    }

    .diagram-flow,
    .diagram-trio,
    .diagram-stack,
    .diagram-loop {
      display: grid;
      gap: 10px;
    }

    .diagram-flow {
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
    }

    .diagram-trio,
    .diagram-stack {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .diagram-loop {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .diagram-card {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .diagram-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--primary-dark);
      font-size: clamp(17px, 1.4vw, 22px);
      line-height: 1.2;
    }

    .diagram-card span {
      display: block;
      color: var(--text-secondary);
      font-size: clamp(14px, 1.1vw, 18px);
      line-height: 1.38;
      word-break: keep-all;
    }

    .diagram-arrow {
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
    }

    .diagram-card.is-blue {
      background: var(--accent-blue-soft);
    }

    .diagram-card.is-yellow {
      background: var(--warning-soft);
    }

    .diagram-card.is-green {
      background: var(--primary-soft);
    }

    .flow-sections {
      display: grid;
      gap: clamp(14px, 1.8vw, 24px);
      max-width: 1120px;
    }

    .flow-body {
      display: grid;
      gap: clamp(14px, 1.8vw, 24px);
      max-width: 1120px;
    }

    .flow-copy,
    .flow-callout {
      color: var(--text-primary);
      font-size: clamp(18px, 1.55vw, 24px);
      font-weight: 650;
      overflow-wrap: break-word;
      text-wrap: pretty;
      word-break: keep-all;
    }

    .flow-copy p,
    .flow-callout p {
      margin-bottom: 10px;
    }

    .flow-copy p:last-child,
    .flow-copy ul:last-child,
    .flow-callout p:last-child {
      margin-bottom: 0;
    }

    .flow-copy ul {
      display: grid;
      gap: 8px;
      margin: 0 0 10px;
      padding-left: 1.2em;
    }

    .flow-callout {
      padding-top: clamp(14px, 1.8vw, 24px);
      border-top: 1px solid var(--border);
    }

    .flow-callout strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-size: clamp(18px, 1.6vw, 24px);
    }

    .scene-box code {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--code-bg);
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    .question-box {
      padding-top: clamp(14px, 1.8vw, 24px);
      border-top: 1px solid var(--border);
    }

    .note-box {
      padding-top: clamp(14px, 1.8vw, 24px);
      border-top: 1px solid var(--border);
    }

    .question-box strong,
    .note-box strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-size: clamp(18px, 1.6vw, 24px);
    }

    .question-box p,
    .note-box p {
      margin-bottom: 0;
      font-size: clamp(17px, 1.35vw, 21px);
      overflow-wrap: break-word;
      text-wrap: pretty;
      word-break: keep-all;
    }

    .activity-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .activity-row .number {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 900;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0;
    }

    .chip {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 800;
    }

    .template-box {
      overflow: hidden;
      margin-top: 14px;
    }

    .template-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    pre {
      overflow-x: auto;
      margin: 0;
      padding: 18px;
      background: var(--code-bg);
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .screen-section {
      margin-top: clamp(28px, 3vw, 38px);
    }

    .screen-section h2 {
      margin-bottom: 16px;
    }

    .screen-panel > .grid:not(.action-grid) {
      margin-top: 18px;
    }

    .screen-section + .grid:not(.action-grid) {
      margin-top: 18px;
    }

    .warning-box + .grid,
    .info-box + .grid {
      margin-top: 18px;
    }

    .activity-timer + .screen-section,
    .activity-timer + .grid:not(.action-grid),
    .activity-timer + .warning-box {
      margin-top: 0;
    }

    .genre-section {
      padding-top: 6px;
    }

    .quiet-link {
      margin-top: clamp(28px, 3vw, 38px);
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .quiet-link a {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
    }

    .quiet-link a:hover,
    .quiet-link a:focus-visible {
      color: var(--primary);
      outline: none;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    [aria-disabled="true"] {
      cursor: not-allowed;
    }

    @media (max-width: 1180px) {
      .app-shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .action-grid,
      .class-grid,
      .three-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1024px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 10;
        min-height: auto;
        max-height: none;
      }

      .screen-nav {
        display: flex;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .tool-panel {
        padding-top: 12px;
      }

      .nav-link {
        min-width: 168px;
      }

      .main-area {
        grid-column: auto;
      }

      .screen-panel {
        min-height: auto;
      }

    }

    @media (max-width: 640px) {
      body {
        font-size: 16px;
      }

      .app-shell {
        padding: 10px;
      }

      .sidebar,
      .screen-panel {
        padding: 14px;
      }

      .action-grid,
      .class-grid,
      .two-grid,
      .three-grid {
        grid-template-columns: 1fr;
      }

      .button,
      .plain-button {
        width: 100%;
        white-space: normal;
      }

      .flow-card {
        min-height: auto;
        gap: 18px;
        padding: 20px;
      }

      .flow-card h3 {
        font-size: 30px;
        line-height: 1.18;
      }

      .scene-box {
        font-size: 18px;
      }

      .flow-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .diagram-flow,
      .diagram-trio,
      .diagram-stack,
      .diagram-loop {
        grid-template-columns: 1fr;
      }

      .diagram-arrow {
        display: none;
      }

      .activity-timer,
      .timer-controls {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="수업 메뉴">
      <a class="brand" href="#start">
        <strong>웹게임 수업 허브</strong>
        <span>고1 게임 제작 프로젝트</span>
      </a>
      <nav class="screen-nav" id="screen-nav" aria-label="화면 이동"></nav>
      <div></div>
      <div class="tool-panel" aria-label="수업 도구">
        <div class="tool-label">기본 AI 도구</div>
        <a class="tool-link" id="gemini-tool-link" href="https://gemini.google.com/" target="_blank" rel="noopener">
          Gemini 열기 <span aria-hidden="true">↗</span>
        </a>
      </div>
    </aside>

    <main class="main-area">
      <section class="screen-panel" id="screen-panel" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const links = {
      groupForm: "https://docs.google.com/forms/d/e/1FAIpQLSfhBzzUkoC1kSjLd9LyCKEl90_MrZUDVh78bl1yo5E5whXn8Q/viewform",
      personalPeerForm: "https://docs.google.com/forms/d/e/1FAIpQLSdfUsuC0gpkc961dT8fGr-UfC7ndb-wi87NWoyy1d4RM2YhQg/viewform",
      commonDocs: {
        class6: "https://docs.google.com/document/d/1vUQtktwEPgD6mQTOatZJOeuzdf-f1DWXdjiTbjyFlfQ/edit?usp=sharing",
        class7: "https://docs.google.com/document/d/1fajgrznFrCp8LpwPr9uALM7cHH99Vvv05vCRk7sh3uA/edit?usp=drivesdk",
        class8: "https://docs.google.com/document/d/1bmRTsGqVe1G7AqlcEgJ49NpItaMS-TA6lY-4ybCOias/edit?usp=sharing"
      },

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (match) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[match]));
    }

    function getScreenIndex(id) {
      return Math.max(0, screens.findIndex((screen) => screen.id === id));
    }

      const raw = window.location.hash.replace("#", "") || "start";
      if (raw === "worksheet") {

        return "plan";
      }
      if (raw === "prompt" || raw === "fix") {
        window.location.replace("#collab");
        return "collab";
      }
      return screens.some((screen) => screen.id === raw) ? raw : "start";
    }

    function getTimerState(screenId) {
      if (!activityTimers[screenId]) return null;
      if (!state.timers[screenId]) {
        state.timers[screenId] = {
          seconds: activityTimers[screenId] * 60,
          running: false
        };
      }
      return state.timers[screenId];
    }

    function formatTimer(seconds) {
      const safeSeconds = Math.max(0, seconds);
      const minutes = Math.floor(safeSeconds / 60);
      const rest = safeSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
    }

    function activityTimer(screenId) {
      const timer = getTimerState(screenId);
      if (!timer) return "";
      return `
        <div class="activity-timer" data-timer-screen="${screenId}">
          <div class="timer-status">
            <strong>교사용 타이머</strong>
            <span>기본 ${activityTimers[screenId]}분 · 시작을 눌러야 시간이 흐릅니다</span>
          </div>
          <div class="timer-display" data-timer-display>${formatTimer(timer.seconds)}</div>
          <div class="timer-controls" aria-label="타이머 조작">
            <button class="plain-button" type="button" data-timer-action="toggle" data-timer-toggle>${timer.running ? "정지" : "시작"}</button>
            <button class="plain-button" type="button" data-timer-action="reset">초기화</button>
            <button class="plain-button" type="button" data-timer-action="add">+1분</button>
            <button class="plain-button" type="button" data-timer-action="subtract">-1분</button>
          </div>
        </div>
      `;
    }

    function renderFlowBlock(block) {
      if (block.type === "copy") {
        return `<div class="flow-copy">${block.html}</div>`;
      }
      if (block.type === "diagram") {
        return `<div class="flow-visual">${block.html}</div>`;
      }
      if (block.type === "callout") {
        return `
          <div class="flow-callout">
            <strong>${escapeHtml(block.label)}</strong>
            <p>${escapeHtml(block.text)}</p>
          </div>
        `;
      }
      return "";
    }

    function updateTimerDisplay(screenId) {
      const timer = getTimerState(screenId);
      const root = document.querySelector(`[data-timer-screen="${screenId}"]`);
      const display = root?.querySelector("[data-timer-display]");
      const toggle = root?.querySelector("[data-timer-toggle]");
      if (timer && root && display) {
        root.classList.toggle("is-running", timer.running);
        display.textContent = formatTimer(timer.seconds);
        if (toggle) {
          toggle.textContent = timer.running ? "정지" : "시작";
        }
      }
    }

    function stopTimerInterval() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTimer(screenId) {
      const timer = getTimerState(screenId);
      if (!timer || timer.seconds <= 0) return;
      Object.values(state.timers).forEach((item) => {
        item.running = false;
      });
      timer.running = true;
      stopTimerInterval();
      updateTimerDisplay(screenId);
      state.timerInterval = setInterval(() => {
        if (!timer.running) return;
        timer.seconds = Math.max(0, timer.seconds - 1);
        updateTimerDisplay(screenId);
        if (timer.seconds === 0) {
          timer.running = false;
          stopTimerInterval();
          updateTimerDisplay(screenId);
        }
      }, 1000);
    }

    function pauseTimer(screenId) {
      const timer = getTimerState(screenId);
      if (!timer) return;
      timer.running = false;
      stopTimerInterval();
      updateTimerDisplay(screenId);
    }

    function toggleTimer(screenId) {
      const timer = getTimerState(screenId);
      if (!timer) return;
      if (timer.running) {
        pauseTimer(screenId);
      } else {
        startTimer(screenId);
      }
    }

    function resetTimer(screenId) {
      const timer = getTimerState(screenId);
      if (!timer) return;
      timer.running = false;
      timer.seconds = activityTimers[screenId] * 60;
      stopTimerInterval();
      updateTimerDisplay(screenId);
    }

    function adjustTimer(screenId, deltaSeconds) {
      const timer = getTimerState(screenId);
      if (!timer) return;
      timer.seconds = Math.max(0, timer.seconds + deltaSeconds);
      if (timer.seconds === 0) {
        timer.running = false;
        stopTimerInterval();
      }
      updateTimerDisplay(screenId);
    }

      ];

      return `
        ${screenHeader("plan", "우리 조 게임을 먼저 정합니다.", "공용 Docs에 들어가기 전, 조원끼리 말로 먼저 정합니다. 화면은 켜두지만 입력보다 대화가 먼저입니다.")}
        ${activityTimer("plan")}
        <section class="screen-section">
          <h2>역할 나누기</h2>
          <div class="grid two-grid">
            <div class="card"><strong>조장</strong><p>진행을 확인하고, 최종 HTML 파일을 Google Forms로 제출</p></div>
            <div class="card"><strong>요청 정리</strong><p>게임 정보와 조건을 함께 문장으로 바꾸기</p></div>
            <div class="card"><strong>디자인</strong><p>화면 분위기, 색, 모양, 배치를 요청 문장에 넣기</p></div>
            <div class="card"><strong>테스트</strong><p>실행 확인, 이상한 점을 공용 독스에 남기기</p></div>
          </div>
        </section>
        <div class="grid two-grid">
          ${rows.map((row, index) => `
            <div class="activity-row">
              <span class="number">${index + 1}</span>
              <div>
                <h3>${row[0]}</h3>
                <p>${row[1]}</p>
              </div>
            </div>
          `).join("")}
        </div>
        <section class="screen-section genre-section">
          <h2>권장 장르</h2>
          <div class="chip-list">
            <span class="chip">피하기 게임</span>
            <span class="chip">클릭 게임</span>
            <span class="chip">반응속도 게임</span>
            <span class="chip">퀴즈 게임</span>
            <span class="chip">기억력 카드 게임</span>
            <span class="chip">타이밍 게임</span>
          </div>
        </section>
      `;
    }

    function commonDocCard(title, meta, href) {
      return `
        <a class="card" href="${href}" target="_blank" rel="noopener">
          <span class="meta">${meta}</span>
          <h3>${title}</h3>
          <p>우리 조 칸에서 요청 문장과 오류 수정 내용을 함께 채웁니다.</p>
        </a>
      `;
    }

    function renderCollab() {
      const rows = [
        ["우리 반 공용 독스 열기", "아래에서 자기 반 버튼을 눌러 새 탭으로 엽니다."],
        ["우리 조 칸 찾기", "독스 안에서 우리 조 번호가 적힌 칸으로 이동합니다."],
        ["게임 정보와 조건 함께 채우기", "제목, 목표, 조작, 성공/실패 조건을 조원들이 나눠 적습니다."],
        ["문제 상황도 같은 곳에 정리하기", "실행 후 이상한 점, 기대한 동작, 실제 동작을 남깁니다."],
        ["정리한 문장을 Gemini에 옮기기", "공용 독스에서 다듬은 요청 문장을 Gemini에 붙여 넣습니다."]
      ];

      return `
        ${screenHeader("collab", "우리 조 내용을 함께 정리합니다.", "우리 반 공용 독스를 열고, 우리 조 칸에서 요청 문장과 오류 수정 내용을 함께 채웁니다.")}
        ${activityTimer("collab")}
        <div class="warning-box">
          <strong>공용 Docs 약속</strong>
          <p>다른 조 칸은 절대 수정하지 않습니다.</p>
          <p>공용 Docs는 조원 모두가 함께 작성합니다.</p>
          <p>최종 파일 제출만 조장이 대표로 합니다.</p>
        </div>
        <div class="grid class-grid" aria-label="반별 공용 독스">
          ${commonDocCard("6반 공용 독스", "6반", links.commonDocs.class6)}
          ${commonDocCard("7반 공용 독스", "7반", links.commonDocs.class7)}
          ${commonDocCard("8반 공용 독스", "8반", links.commonDocs.class8)}
        </div>
        <section class="screen-section">
          <h2>할 일</h2>
          <div class="grid two-grid">
            ${rows.map((row, index) => `
              <div class="activity-row">
                <span class="number">${index + 1}</span>
                <div>
                  <h3>${row[0]}</h3>
                  <p>${row[1]}</p>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderRun() {
      const rows = [
        ["Gemini 결과물 다운로드", "Gemini가 만든 결과물을 .html 파일로 다운로드합니다."],
        ["다운로드 위치 찾기", "브라우저 다운로드 목록이나 다운로드 폴더에서 파일을 찾습니다."],
        ["브라우저로 실행", "Chrome 또는 Edge에서 다운로드한 .html 파일을 엽니다."],
        ["이상한 점 찾기", "테스트 담당이 조작, 점수, 성공/실패 조건에서 이상한 점을 찾습니다."],
        ["수정 요청 남기기", "공용 Docs에 문제 상황, 기대한 동작, 실제 동작을 적고 Gemini에 다시 요청합니다."]
      ];
      return `
        ${screenHeader("run", "다운로드한 HTML 파일을 실행하고 고칩니다.", "Gemini가 만든 파일을 다운로드하고, 브라우저에서 실행한 뒤 이상한 점을 찾아 수정 요청을 남깁니다.")}
        ${activityTimer("run")}
        <div class="grid two-grid">
          ${rows.map((row, index) => `
            <div class="activity-row">
              <span class="number">${index + 1}</span>
              <div>
                <h3>${row[0]}</h3>
                <p>${row[1]}</p>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function formCard(title, meta, details, href) {
      const pending = href === "#";
      return `
        <a class="card" href="${href}" target="_blank" rel="noopener" aria-disabled="${pending ? "true" : "false"}">
          <span class="meta ${pending ? "pending" : ""}">${pending ? "링크 준비 중" : "열기"}</span>
          <h3>${title}</h3>
          <p><strong>대상:</strong> ${meta}</p>
          <p>${details}</p>
        </a>
      `;
    }

    function renderSubmit() {
      return `
        ${screenHeader("submit", "조장 제출과 개인·상호평가를 진행합니다.", "조장이 최종 HTML 파일을 제출하는 동안, 조원은 개인·상호평가를 제출합니다.")}
        ${activityTimer("submit")}
        <div class="grid two-grid">
          ${formCard("조별 게임 제출", "조장 1명", "학급, 조 번호, 게임 제목, 한 줄 소개, HTML 파일 업로드", links.groupForm)}
          ${formCard("개인·상호평가", "조원 각자", "조장이 제출하는 동안 내 역할과 실제로 한 일, 조 활동에서 좋았던 점과 개선점을 제출합니다.", links.personalPeerForm)}
        </div>
      `;
    }

    function arcadeCard(title, meta, detail, href) {
      return `
        <a class="card" href="${href}">
          <span class="meta">${meta}</span>
          <h3>${title}</h3>
          <p>${detail}</p>
        </a>
      `;
    }

    function renderArcade() {
      return `
        ${screenHeader("arcade", "반별 게임 모음으로 이동합니다.", "교사 업로드 후 반별 게임 모음에서 다른 조 게임을 확인합니다.")}
        <div class="grid class-grid">
          ${arcadeCard("6반 게임 모음", "6반", "1조부터 6조까지", links.class6)}
          ${arcadeCard("7반 게임 모음", "7반", "1조부터 6조까지", links.class7)}
          ${arcadeCard("8반 게임 모음", "8반", "1조부터 6조까지", links.class8)}
        </div>
        <div class="quiet-link">
          <a href="${links.exampleGame}">예시 게임</a>
        </div>
      `;
    }

    const renderers = {
      start: renderStart,
      flow: renderFlow,
      plan: renderPlan,
      collab: renderCollab,
      run: renderRun,
      submit: renderSubmit,
      arcade: renderArcade
    };

    async function copyTemplate(targetId, button) {
      const target = document.getElementById(targetId);
      if (!target) return;

      const text = target.textContent;
      try {
        await navigator.clipboard.writeText(text);
        const originalText = button.textContent;
        button.textContent = "복사됨";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1400);
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents(target);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
    }

    function setFlowStep(index) {
      state.flowStep = Math.max(0, Math.min(index, lessonFlow.length - 1));
      const item = lessonFlow[state.flowStep];
      const stepLabel = document.querySelector("#step-label");
      const stepTitle = document.querySelector("#step-title");
      const stepBody = document.querySelector("#step-body");
      const prevStep = document.querySelector("#prev-step");
      const nextStep = document.querySelector("#next-step");

      if (!stepLabel) return;
      stepLabel.textContent = item.step;
      stepTitle.textContent = item.title;
      stepBody.innerHTML = item.blocks.map(renderFlowBlock).join("");

      prevStep.disabled = state.flowStep === 0;
      nextStep.disabled = state.flowStep === lessonFlow.length - 1;
    }

    function bindScreenEvents() {
      document.querySelectorAll(".copy-button").forEach((button) => {
        button.addEventListener("click", () => copyTemplate(button.dataset.copyTarget, button));
      });

      document.querySelectorAll('[aria-disabled="true"]').forEach((link) => {
        link.addEventListener("click", (event) => event.preventDefault());
      });

      const prevStep = document.querySelector("#prev-step");
      const nextStep = document.querySelector("#next-step");
      if (prevStep && nextStep) {
        prevStep.addEventListener("click", () => setFlowStep(state.flowStep - 1));
        nextStep.addEventListener("click", () => setFlowStep(state.flowStep + 1));
      }

      document.querySelectorAll("[data-timer-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const timerRoot = button.closest("[data-timer-screen]");
          if (!timerRoot) return;
          const screenId = timerRoot.dataset.timerScreen;
          const action = button.dataset.timerAction;
          if (action === "toggle") toggleTimer(screenId);
          if (action === "reset") resetTimer(screenId);
          if (action === "add") adjustTimer(screenId, 60);
          if (action === "subtract") adjustTimer(screenId, -60);
        });
      });
    }

    function renderScreen() {
      if (state.screenId !== normalizeHash()) {
        pauseTimer(state.screenId);
      }
      state.screenId = normalizeHash();
      const renderer = renderers[state.screenId] || renderStart;
      const current = screens[getScreenIndex(state.screenId)];
      document.title = `${current.label} · 웹게임 수업 허브`;
      screenPanel.innerHTML = renderer();
      renderShellState();
      bindScreenEvents();

      if (state.screenId === "flow") {
        setFlowStep(state.flowStep);
      }
      if (activityTimers[state.screenId]) {
        updateTimerDisplay(state.screenId);
      }
    }

    renderNav();
    geminiToolLink.setAttribute("href", links.gemini);
    renderScreen();

    window.addEventListener("hashchange", renderScreen);

    document.addEventListener("keydown", (event) => {
      if (state.screenId !== "flow") return;
      if (event.key === "ArrowLeft") {
        setFlowStep(state.flowStep - 1);
      }
      if (event.key === "ArrowRight") {
        setFlowStep(state.flowStep + 1);
      }
    });
  </script>
</body>
</html>
